<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Facture de Consultation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f2f2f2;
        }
        .facture-box {
            background-color: white;
            padding: 20px;
            width: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 {
            color: #007bff;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .total {
            margin-top: 15px;
            font-weight: bold;
            text-align: right;
            color: green;
        }
    </style>
</head>
<body>

    <div class="facture-box">
        <h2>Facture de Consultation</h2>
        
        <p><strong>Médecin:</strong> Dr. Anis</p>
        <p><strong>Patient:</strong> Maram</p>
        <p><strong>Date:</strong> 13/11/2026</p>

        <table>
            <tr>
                <th>Service</th>
                <th>Prix</th>
            </tr>
            <tr>
                <td>Consultation médicale</td>
                <td>60 DT</td>
            </tr>
        </table>

        <p class="total">Total: 60 DT</p>
    </div>

</body>
</html>
